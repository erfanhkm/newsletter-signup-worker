name = "newsletter-signup"
main = "worker.js"
compatibility_date = "2026-10-19"
# Deployed via Cloudflare Workers Builds from GitHub
# Secrets (BUTTONDOWN_API_KEY, TURNSTILE_SECRET_KEY, INTERNAL_SECRET) are set in the Cloudflare dashboard and persist across deploys.

# Rate limiting for the public subscribe endpoint (cycle 9)
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
